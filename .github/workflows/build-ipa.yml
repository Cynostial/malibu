name: Build Malibu IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project Malibu.xcodeproj \
            -scheme Malibu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | xcbeautify

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Malibu.app Payload/
          /usr/bin/codesign --force --sign - --entitlements Malibu/Malibu.entitlements Payload/Malibu.app
          ditto -c -k --sequesterRsrc --keepParent Payload Malibu-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Malibu-unsigned-ipa
          path: Malibu-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
